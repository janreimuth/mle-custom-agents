[project]
name = "mle-custom-agents"
version = "0.1.0"
requires-python = ">=3.13.17"
dependencies = [
    "pydantic-ai[groq,mistral,openrouter]>=2.60.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
required-version = ">=0.13.5"
# Apply certificate fixes without adding unused runtime packages.
constraint-dependencies = ["certifi>=2026.10.19", "pip>=26.2.2"]
